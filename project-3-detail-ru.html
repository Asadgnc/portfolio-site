                <h1>Название проекта 3 (напр.: Децентрализованная система голосования)</h1>
                <p class="section-subtitle project-subtitle">
                    Концептуальное приложение (доказательство концепции), использующее технологию блокчейн 
                    для обеспечения прозрачных и неизменяемых записей голосования.
                </p>
            </section>
            <img src="images/proje-3.jpg" alt="Главное изображение проекта 3" class="project-detail-main-image">
            <section class="project-detail-content">
                <div class="project-detail-grid">
                    <div class="project-detail-text">
                        <h2>Задача</h2>
                        <p>
                            Традиционные системы голосования часто сталкиваются с проблемами доверия, централизованного контроля 
                            и потенциальной фальсификации. Цель состояла в том, чтобы разработать систему, в которой каждый голос 
                            записывается безопасно, прозрачно и неизменяемо, что делает весь процесс полностью проверяемым любым желающим.
                        </p>
                        <h2>Моё решение</h2>
                        <p>
                            Я разработал базовую модель, использующую Python для симуляции основных принципов блокчейн-реестра. 
                            Каждый "голос" хранится как транзакция внутри блока, и эти блоки криптографически связаны между собой. 
                            Система гарантирует, что после добавления блока голоса внутри него не могут быть изменены, 
                            демонстрируя ключевые преимущества децентрализованной технологии для обеспечения целостности.
                        </p>
                        <h2>Ключевые результаты</h2>
                        <p>
                            Этот проект успешно продемонстрировал мое понимание криптографического хеширования, распределенных реестров 
                            и того, как применять фундаментальные концепции информатики к реальным социальным проблемам. 
                            Он служит прочной основой для изучения передовых архитектур распределенных систем.
                        </p>
                    </div>
